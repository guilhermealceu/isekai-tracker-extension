<!doctype html>
<html lang="pt-br">
<meta charset="utf-8" />
<title>Isekai;Tracker 2.0</title>
<style>
  :root {
    --bg: #0a0e1a;
    --card: #121825; 
    --ink: #f0f4fa;
    --muted: #9aa8bb;
    --accent: #00ffb0;
    --border: #252f3f;
  }
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-width: 320px;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  
  header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    backdrop-filter: blur(4px);
  }
  
  header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #94a3b8;
    transition: all 0.3s ease;
    box-shadow: 0 0 12px rgba(0, 255, 176, 0.3);
  }
  
  header .on {
    background: #10b981;
    box-shadow: 0 0 16px #10b981;
  }
  
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  main {
    padding: 18px;
  }
  
  #card {
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .series {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 8px;
    color: #fff;
    letter-spacing: -0.2px;
  }
  
  .episode {
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 500;
  }
  
  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  
  progress {
    width: 100%;
    height: 10px;
    border-radius: 12px;
    overflow: hidden;
    margin: 12px 0 8px;
    border: none;
    background: var(--border);
  }
  
  progress::-webkit-progress-bar {
    background: var(--border);
    border-radius: 12px;
  }
  
  progress::-webkit-progress-value {
    background: linear-gradient(90deg, var(--accent), #00e6a0);
    border-radius: 12px;
    transition: width 0.2s ease;
  }
  
  .grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 16px;
    font-size: 13px;
    color: var(--muted);
    background: rgba(18, 24, 37, 0.6);
    padding: 14px;
    border-radius: 14px;
    margin: 12px 0;
    border: 1px solid var(--border);
    backdrop-filter: blur(2px);
  }
  
  .grid div:nth-child(odd) {
    color: #8a99af;
    font-weight: 500;
  }
  
  .grid div:nth-child(even) {
    color: #e2e9f2;
    font-weight: 600;
  }
  
  .mono {
    font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
    font-size: 12.5px;
    letter-spacing: 0.2px;
  }
  
  .hint {
    margin-top: 16px;
    font-size: 11.5px;
    color: #6f7e94;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(0, 255, 176, 0.04);
    border-radius: 40px;
    border: 1px solid rgba(0, 255, 176, 0.1);
  }
  
  .hint .mono {
    color: var(--accent);
    font-size: 11px;
    background: rgba(0, 255, 176, 0.1);
    padding: 3px 8px;
    border-radius: 30px;
  }
  
  .small {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 28px 16px;
    background: var(--card);
    border-radius: 24px;
    border: 1px solid var(--border);
    font-weight: 400;
    letter-spacing: 0.2px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  }
  
  #empty {
    margin: 4px 0;
  }
  
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  
  /* Sutil glow no container principal */
  main {
    position: relative;
  }
  
  main::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.2;
  }
</style>
<header>
  <div id="statusDot" class="dot"></div>
  <h1>Isekai;Tracker 2.0</h1>
</header>
<main>
  <div id="empty" class="small">✨ Abra um episódio no Crunchyroll para ver o status aqui</div>
  <div id="card" style="display:none">
    <div class="row series" id="series"></div>
    <div class="row episode" id="episode"></div>
    <div class="meta" id="meta"></div>
    <progress id="pbar" max="100" value="0"></progress>
    <div class="grid">
      <div>Posição</div><div class="mono" id="pos">–</div>
      <div>Duração</div><div class="mono" id="dur">–</div>
      <div>Acumulado</div><div class="mono" id="acc">–</div>
      <div>Status</div><div class="mono" id="st">–</div>
    </div>
    <div class="hint">
      <span>📡 Envio →</span>
      <span class="mono">http://localhost:3005</span>
    </div>
  </div>
</main>
<script src="popup.js"></script>
</html>
